<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قوات الأمن الخاصة | SSF Digital Portal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ssf-gray: #374151;
            --ssf-silver: #f3f4f6;
            --ssf-dark: #111827;
            --ssf-accent: #9ca3af;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--ssf-dark);
            color: var(--ssf-silver);
            direction: rtl;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* شاشة الشعار الافتتاحية */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--ssf-dark); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1.5s ease-out, visibility 1.5s;
        }
        .intro-logo {
            width: 250px; height: 250px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Special_Security_Forces_Saudi_Arabia.svg/1200px-Special_Security_Forces_Saudi_Arabia.svg.png') no-repeat center/contain;
        }

        .main-header {
            width: 100%; background: var(--ssf-gray); padding: 30px 20px;
            text-align: center; border-bottom: 4px solid var(--ssf-accent);
        }

        .container { width: 100%; max-width: 500px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .ssf-btn {
            background: var(--ssf-silver); color: var(--ssf-dark);
            padding: 18px; border-radius: 8px; display: flex; align-items: center;
            text-decoration: none; font-weight: 700; transition: 0.3s;
            border-right: 8px solid var(--ssf-gray); cursor: pointer;
            width: 100%; border: none; font-size: 1rem;
        }
        .ssf-btn:hover { transform: scale(1.02); background: #fff; }
        .ssf-btn i { margin-left: 15px; font-size: 1.2rem; color: var(--ssf-gray); }

        /* نافذة العرض المنبثقة */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-box {
            background: #1f2937; width: 90%; max-width: 450px; padding: 25px;
            border-radius: 15px; border: 1px solid var(--gold); position: relative;
            max-height: 80vh; overflow-y: auto; box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
        }

        .cert-title { color: var(--gold); font-size: 1.4rem; text-align: center; margin-bottom: 15px; border-bottom: 1px solid #374151; padding-bottom: 10px; }
        
        /* تأثير تظليل الكلمات للقراءة الآلية */
        .reading-text { line-height: 1.8; color: #d1d5db; text-align: justify; font-size: 1rem; }
        .reading-text span { transition: all 0.2s; padding: 0 2px; border-radius: 3px; }
        .highlight { color: #000 !important; background: var(--gold) !important; font-weight: bold; }

        #adminPanel { display: none; background: #1f2937; padding: 20px; border-radius: 10px; margin-top: 15px; border: 1px solid var(--ssf-accent); }
        .input-ssf { width: 100%; padding: 12px; background: #000; border: 1px solid var(--ssf-accent); color: white; text-align: center; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- الشاشة الافتتاحية -->
    <div id="intro-overlay"><div class="intro-logo"></div></div>

    <header class="main-header">
        <h2>قوات الأمن الخاصة | SSF</h2>
        <p style="font-size: 0.8rem; color: var(--ssf-accent);">هيبة . قوة . انضباط</p>
    </header>

    <main class="container">
        <!-- أزرار الشهادات -->
        <div class="ssf-btn" onclick="showCert('basic')"><i class="fas fa-medal"></i> شهادة الفرد الأساسي</div>
        <div class="ssf-btn" onclick="showCert('protection')"><i class="fas fa-user-shield"></i> شهادة أمن وحماية</div>
        <div class="ssf-btn" onclick="showCert('raid')"><i class="fas fa-person-rifle"></i> شهادة وحدة المداهمات</div>
        
        <!-- الهيكل القيادي -->
        <div class="ssf-btn" onclick="showPop('leadersPop')" style="margin-top:10px; background:var(--ssf-gray); color:white;">
            <i class="fas fa-users-cog"></i> الهيكل القيادي
        </div>

        <div style="text-align:center; padding:20px; font-size:0.7rem; cursor:pointer; color:var(--ssf-accent);" onclick="openAdmin()">إدارة المنظومة</div>
        
        <div id="adminPanel">
            <input type="text" id="admID" class="input-ssf" placeholder="الرقم العسكري">
            <input type="text" id="admStatus" class="input-ssf" placeholder="النتيجة النهائية">
            <button onclick="saveData()" style="width:100%; padding:12px; background:var(--gold); color:black; border:none; font-weight:900; cursor:pointer; border-radius:5px;">حفظ السجل</button>
        </div>
    </main>

    <!-- نافذة الشهادات الديناميكية -->
    <div id="certModal" class="modal-overlay" onclick="hidePop('certModal')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 id="mTitle" class="cert-title"></h3>
            <div id="mBody" class="reading-text"></div>
            <button onclick="hidePop('certModal')" style="width:100%; padding:12px; margin-top:20px; background:var(--gold); border:none; font-weight:bold; cursor:pointer; border-radius:5px;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة القادة -->
    <div id="leadersPop" class="modal-overlay" onclick="hidePop('leadersPop')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <h3 class="cert-title">قادة القوات</h3>
            <div style="line-height: 2.5; text-align: center;">
                <p><b>القائد:</b> الملازم أول هيثم الأسمري</p>
                <p><b>نائب القائد:</b> النقيب عمار العنزي</p>
                <p><b>الإدارة:</b> الرقيب مؤيد الزهراني</p>
            </div>
        </div>
    </div>

    <script>
        const dbURL = "https://kr-soldiers-default-rtdb.firebaseio.com/ssf";

        // نصوص الشهادات المحدثة
        const certData = {
            basic: {
                title: "شهادة الفرد الأساسي",
                content: "التعريف: اللبنة الأولى في بناء العسكري المحترف داخل القوات. وصف الشهادة: هي الدورة التأسيسية الإلزامية لكل فرد ينضم لقوات الأمن الخاصة، تركز على تحويل الفرد من الحياة المدنية إلى الحياة العسكرية الاحترافية. أهداف الدورة: غرس قيم الانضباط العسكري والولاء والضبط والربط العسكري الصارم بالإضافة إلى تدريبات مكثفة على اللياقة البدنية والمهارات القتالية الأساسية. المميزات: اعتماد الفرد كعنصر رسمي ومفعل ضمن صفوف قوة الأمن الخاصة. الأولوية في صرف وتأمين العهدة العسكرية الأساسية اللازمة. فتح المجال للالتحاق بمختلف الدورات التخصصية المتقدمة. صرف البدلات والامتيازات المالية الأساسية للفرد العسكري."
            },
            protection: {
                title: "شهادة أمن وحماية",
                content: "التعريف: تأهيل المنسوبين لحماية الشخصيات والمنشآت الحيوية. وصف الشهادة: دورة تخصصية مخصصة لتأمين المنشآت الحيوية ذات الحساسية العالية وتوفير الحماية الشاملة والمباشرة للشخصيات الهامة والقيادات العليا. أهداف الدورة: التدريبات المكثفة على الرصد والمراقبة الوقائية والقيادة الوقائية التكتيكية وحماية الشخصيات في مختلف الظروف والبيئات الميدانية. المميزات: إمكانية العمل المباشر في وحدات حماية الشخصيات الهامة والمواكب الرسمية. الأولوية والترشيح لمرافقة وتأمين القيادات العليا. الحصول رسمياً على لقب مرافق شخصي متخصص. صلاحية حمل واستخدام أسلحة تكتيكية مخصصة."
            },
            raid: {
                title: "شهادة وحدة المداهمات",
                content: "التعريف: دورة تخصصية في اقتحام وتطهير المواقع عالية الخطورة. وصف الشهادة: دورة تخصصية متقدمة ونوعية تهدف إلى تدريب وتأهيل الأفراد على كيفية تنفيذ عمليات الاقتحام والمداهمة للأماكن المغلقة وعالية الخطورة. أهداف الدورة: تشمل التدريبات محاكاة واقعية لإنقاذ الرهائن والتعامل الاحترافي مع العناصر الإرهابية والمجرمين الخطرين واستخدام الأسلحة التكتيكية السريعة الدقيقة. المميزات: الحصول رسمياً على لقب عنصر اقتحام متخصص. صلاحية قيادة الفرق الميدانية وتوجيه العمليات أثناء تنفيذ المداهمات. الأولوية لقيادة مهام التدخل السريع التكتيكية. زيادة ملحوظة في البدلات التخصصية المرتبطة بالخطر."
            }
        };

        // وظيفة عرض الشهادة مع تأثير القراءة
        function showCert(type) {
            const data = certData[type];
            document.getElementById('mTitle').innerText = data.title;
            const body = document.getElementById('mBody');
            body.innerHTML = '';
            
            // تقسيم النص إلى كلمات
            data.content.split(' ').forEach(word => {
                const span = document.createElement('span');
                span.innerText = word + ' ';
                body.appendChild(span);
            });

            document.getElementById('certModal').style.display = 'flex';
            startReading();
        }

        // تأثير القراءة الآلية (تظليل الكلمات)
        function startReading() {
            if(window.currentInterval) clearInterval(window.currentInterval);
            const words = document.querySelectorAll('.reading-text span');
            let i = 0;
            window.currentInterval = setInterval(() => {
                if (i > 0) words[i-1].classList.remove('highlight');
                if (i < words.length) {
                    words[i].classList.add('highlight');
                    i++;
                } else {
                    clearInterval(window.currentInterval);
                }
            }, 180); // سرعة القراءة
        }

        function showPop(id) { document.getElementById(id).style.display = 'flex'; }
        
        function hidePop(id) { 
            document.getElementById(id).style.display = 'none'; 
            if(window.currentInterval) clearInterval(window.currentInterval);
        }

        function openAdmin() {
            const u = prompt("اسم المستخدم:");
            const p = prompt("كلمة المرور:");
            if(u === "Admin" && p === "@Admin") document.getElementById('adminPanel').style.display = 'block';
        }

        async function saveData() {
            const id = document.getElementById('admID').value;
            const st = document.getElementById('admStatus').value;
            if(!id || !st) return;
            await fetch(`${dbURL}/${id}.json`, { method: 'PUT', body: JSON.stringify({ status: st }) });
            alert("تم الحفظ بنجاح.");
        }

        window.onload = () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-overlay');
                intro.style.opacity = '0';
                setTimeout(() => intro.style.visibility = 'hidden', 1500);
            }, 2500);
        };
    </script>
</body>
</html>
