<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قوات الأمن الخاصة | SSF</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* الألوان المستوحاة من الصورة 162771.jpg */
        :root {
            --ssf-bg: #111827;
            --ssf-header: #374151;
            --ssf-card: #f9fafb;
            --ssf-text-dark: #1f2937;
            --ssf-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--ssf-bg);
            color: #fff;
            direction: rtl;
        }

        /* شاشة الشعار (تأكد من ظهورها) */
        #intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--ssf-bg); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 1s ease-out, visibility 1s;
        }
        .intro-logo {
            width: 200px; height: 200px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Special_Security_Forces_Saudi_Arabia.svg/1200px-Special_Security_Forces_Saudi_Arabia.svg.png') no-repeat center/contain;
        }

        header {
            background: var(--ssf-header);
            padding: 40px 20px;
            text-align: center;
        }

        header h1 { font-size: 1.8rem; font-weight: 900; }
        header p { font-size: 0.9rem; color: #9ca3af; margin-top: 5px; }

        .container {
            max-width: 450px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* تصميم الأزرار كما في الصورة 162771.jpg */
        .ssf-btn {
            background: var(--ssf-card);
            color: var(--ssf-text-dark);
            padding: 22px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .ssf-btn i { font-size: 1.3rem; }

        .btn-gray { background: #374151; color: #fff; }

        /* نافذة القراءة الآلية */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            align-items: center; justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1f2937;
            width: 100%; max-width: 400px;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid var(--ssf-gold);
        }

        .modal-content h3 { color: var(--ssf-gold); margin-bottom: 15px; text-align: center; }

        .reading-area { line-height: 1.8; font-size: 1rem; color: #e5e7eb; text-align: justify; }
        .reading-area span { transition: 0.2s; padding: 0 2px; }
        .highlight { background: var(--ssf-gold); color: #000; font-weight: bold; border-radius: 3px; }

    </style>
</head>
<body>

    <div id="intro-overlay"><div class="intro-logo"></div></div>

    <header>
        <h1>قوات الأمن الخاصة | SSF</h1>
        <p>هيبة . قوة . انضباط</p>
    </header>

    <main class="container">
        <!-- الأزرار بنفس ترتيب وشكل الصورة 162771.jpg -->
        <button class="ssf-btn" onclick="startReading('basic')">
            <i class="fas fa-medal"></i>
            <span>شهادة الفرد الأساسي</span>
            <span></span> <!-- مساحة توازن -->
        </button>

        <button class="ssf-btn" onclick="startReading('protection')">
            <i class="fas fa-user-shield"></i>
            <span>شهادة أمن وحماية</span>
            <span></span>
        </button>

        <button class="ssf-btn" onclick="startReading('raid')">
            <i class="fas fa-person-rifle"></i>
            <span>شهادة وحدة المداهمات</span>
            <span></span>
        </button>

        <button class="ssf-btn btn-gray" onclick="toggleModal('leadersPop')">
            <i class="fas fa-users"></i>
            <span>الهيكل القيادي</span>
            <span></span>
        </button>
    </main>

    <!-- نافذة القراءة -->
    <div id="readerModal" class="modal" onclick="closeAll()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="mTitle"></h3>
            <div id="mBody" class="reading-area"></div>
        </div>
    </div>

    <!-- نافذة القادة -->
    <div id="leadersPop" class="modal" onclick="closeAll()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>الهيكل القيادي</h3>
            <div style="text-align: center; line-height: 2.5;">
                <p><b>القائد:</b> الملازم أول هيثم الأسمري</p>
                <p><b>نائب القائد:</b> النقيب عمار العنزي</p>
                <p><b>الإدارة:</b> الرقيب مؤيد الزهراني</p>
            </div>
        </div>
    </div>

    <script>
        const certs = {
            basic: { title: "الفرد الأساسي", text: "التعريف: اللبنة الأولى في بناء العسكري المحترف داخل القوات. وصف الشهادة: هي الدورة التأسيسية الإلزامية لكل فرد ينضم لقوات الأمن الخاصة تركز على تحويل الفرد من الحياة المدنية إلى الحياة العسكرية الاحترافية. أهداف الدورة: غرس قيم الانضباط العسكري والولاء والضبط والربط العسكري الصارم بالإضافة إلى تدريبات مكثفة على اللياقة البدنية والمهارات القتالية الأساسية. المميزات: اعتماد الفرد كعنصر رسمي ومفعل ضمن صفوف قوة الأمن الخاصة. الأولوية في صرف وتأمين العهدة العسكرية الأساسية اللازمة. فتح المجال للالتحاق بمختلف الدورات التخصصية المتقدمة." },
            protection: { title: "أمن وحماية", text: "التعريف: تأهيل المنسوبين لحماية الشخصيات والمنشآت الحيوية. وصف الشهادة: دورة تخصصية مخصصة لتأمين المنشآت الحيوية ذات الحساسية العالية وتوفير الحماية الشاملة والمباشرة للشخصيات الهامة والقيادات العليا. أهداف الدورة: التدريبات المكثفة على الرصد والمراقبة الوقائية والقيادة الوقائية التكتيكية وحماية الشخصيات في مختلف الظروف والبيئات الميدانية. المميزات: إمكانية العمل المباشر في وحدات حماية الشخصيات الهامة والمواكب الرسمية. الحصول على لقب مرافق شخصي متخصص." },
            raid: { title: "وحدة المداهمات", text: "التعريف: دورة تخصصية في اقتحام وتطهير المواقع عالية الخطورة. وصف الشهادة: دورة تخصصية متقدمة تهدف إلى تدريب وتأهيل الأفراد على كيفية تنفيذ عمليات الاقتحام والمداهمة للأماكن المغلقة وعالية الخطورة. أهداف الدورة: تشمل التدريبات محاكاة واقعية لإنقاذ الرهائن والتعامل مع العناصر الإرهابية والمجرمين الخطرين. المميزات: الحصول على لقب عنصر اقتحام متخصص. صلاحية قيادة الفرق الميدانية وتوجيه العمليات أثناء تنفيذ المداهمات." }
        };

        let readTimer;

        function startReading(id) {
            const data = certs[id];
            document.getElementById('mTitle').innerText = data.title;
            const body = document.getElementById('mBody');
            body.innerHTML = data.text.split(' ').map(w => `<span>${w}</span>`).join(' ');
            
            document.getElementById('readerModal').style.display = 'flex';
            
            let i = 0;
            const spans = body.querySelectorAll('span');
            if(readTimer) clearInterval(readTimer);
            readTimer = setInterval(() => {
                if(i > 0) spans[i-1].classList.remove('highlight');
                if(i < spans.length) {
                    spans[i].classList.add('highlight');
                    i++;
                } else { clearInterval(readTimer); }
            }, 200);
        }

        function toggleModal(id) { document.getElementById(id).style.display = 'flex'; }
        
        function closeAll() {
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            if(readTimer) clearInterval(readTimer);
        }

        window.onload = () => {
            setTimeout(() => {
                const intro = document.getElementById('intro-overlay');
                intro.style.opacity = '0';
                setTimeout(() => intro.style.visibility = 'hidden', 1000);
            }, 2000);
        };
    </script>
</body>
</html>
